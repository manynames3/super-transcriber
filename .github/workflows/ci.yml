name: CI

on:
  push:
    branches:
      - main
      - codex/enterprise-v2
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            cdk/package-lock.json
            frontend/package-lock.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Lambda build dependencies
        working-directory: cdk
        run: npm ci

      - name: Build Lambda TypeScript
        working-directory: cdk
        run: npm run build

      - name: Bundle Lambda artifacts for Terraform
        working-directory: cdk
        run: npm run build:lambdas

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init without remote backend
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Workflow YAML syntax sanity check
        run: |
          ruby -e 'require "yaml"; ARGV.each { |file| YAML.load_file(file); puts "YAML OK: #{file}" }' \
            .github/workflows/*.yml \
            docs/examples/*.yml

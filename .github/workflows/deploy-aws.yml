name: Deploy AWS

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.TF_AWS_REGION || 'us-east-1' }}
      TF_VAR_allowed_origin: ${{ vars.TF_ALLOWED_ORIGIN }}
      TF_VAR_aws_region: ${{ vars.TF_AWS_REGION || 'us-east-1' }}
      TF_VAR_environment: ${{ vars.TF_ENVIRONMENT || 'dev' }}
      TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME || 'super-transcriber' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deploy configuration
        run: |
          missing=0

          if [ -z "${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}" ]; then
            echo "::error::Missing GitHub secret AWS_GITHUB_ACTIONS_ROLE_ARN"
            missing=1
          fi

          if [ -z "${{ vars.TF_ALLOWED_ORIGIN }}" ]; then
            echo "::error::Missing GitHub variable TF_ALLOWED_ORIGIN"
            missing=1
          fi

          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then
            echo "::error::Missing GitHub variable TF_STATE_BUCKET"
            missing=1
          fi

          if [ -z "${{ vars.TF_STATE_KEY }}" ]; then
            echo "::error::Missing GitHub variable TF_STATE_KEY"
            missing=1
          fi

          if [ -z "${{ vars.TF_STATE_REGION }}" ]; then
            echo "::error::Missing GitHub variable TF_STATE_REGION"
            missing=1
          fi

          if [ -z "${{ vars.TF_STATE_LOCK_TABLE }}" ]; then
            echo "::error::Missing GitHub variable TF_STATE_LOCK_TABLE"
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cdk/package-lock.json

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.9

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}

      - name: Install Lambda build dependencies
        working-directory: cdk
        run: npm ci

      - name: Bundle Lambda artifacts
        working-directory: cdk
        run: npm run build:lambdas

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.TF_STATE_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve
